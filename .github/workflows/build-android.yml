name: Build Chaima Android APK (V0.5)

on:
  workflow_dispatch:
  push:
    paths:
      - 'chaima-order-manager-v0.5-logo.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract V0.5 project
        run: |
          ZIP="chaima-order-manager-v0.5-logo.zip"
          test -f "$ZIP" || { echo "Missing $ZIP in repository root"; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          ROOT="$(find extracted -type f -name package.json -print -quit | xargs dirname)"
          test -n "$ROOT" || { echo "package.json not found in V0.5 ZIP"; exit 1; }
          cp -a "$ROOT"/. .
          echo "Project source: $ROOT"
          test -f public/order-manager-logo.png || { echo "New logo asset is missing"; exit 1; }
          grep -q 'v0.5.0' src/main.jsx || { echo "V0.5 source marker not found"; exit 1; }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chaima-order-manager-v05-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
