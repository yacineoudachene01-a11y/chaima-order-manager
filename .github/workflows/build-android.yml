name: Build Chaima Android APK (V0.5)

on:
  workflow_dispatch:
  push:
    paths:
      - 'chaima-order-manager-v0.5-logo.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract V0.5 project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="chaima-order-manager-v0.5-logo.zip"
          test -f "$ZIP" || { echo "ERROR: Missing $ZIP in repository root"; exit 1; }
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          ROOT="$(find extracted -type f -name package.json -print -quit | xargs -r dirname)"
          test -n "$ROOT" || { echo "ERROR: package.json not found in V0.5 ZIP"; exit 1; }
          cp -a "$ROOT"/. .
          echo "Project source: $ROOT"
          test -f package.json || { echo "ERROR: package.json missing after extraction"; exit 1; }
          test -f public/order-manager-logo.png || { echo "ERROR: New logo asset is missing"; exit 1; }
          node -e "const p=require('./package.json'); if(p.version!=='0.5.0') { console.error('Wrong project version:',p.version); process.exit(1) } console.log('Verified project version:',p.version)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Intentionally no npm cache: the project ZIP has no lockfile yet.

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chaima-order-manager-v05-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
